<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Social Grupo 3</title>
  <style>
    :root {
      --azul: #1877f2;
      --azul-oscuro: #166fe5;
      --fondo: #f0f2f5;
      --texto: #1c1e21;
      --texto-suave: #65676b;
      --borde: #ced0d4;
      --superficie: #ffffff;
      --hover: #f0f2f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--fondo);
      color: var(--texto);
    }

    .barra {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--superficie);
      border-bottom: 1px solid var(--borde);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icono {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--azul), #0d65d9);
      color: #fff;
      font-size: 20px;
    }

    .marca-texto {
      font-size: 18px;
      font-weight: 700;
      color: var(--azul);
      letter-spacing: -0.3px;
    }

    .buscar-falso {
      display: none;
    }

    .contenedor {
      max-width: 680px;
      margin: 20px auto 60px;
      padding: 0 12px;
    }

    /* Compositor estilo Facebook */
    .compositor {
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .compositor textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 17px;
      color: var(--texto);
      padding: 8px 4px;
      min-height: 60px;
    }

    .compositor textarea:focus {
      border-bottom: 1px solid var(--borde);
    }

    .compositor-pie {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e4e6eb;
    }

    .compositor-pie input {
      flex: 1;
      border: 1px solid var(--borde);
      border-radius: 20px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 15px;
      color: var(--texto);
      background: var(--fondo);
      outline: none;
    }

    .compositor-pie input:focus {
      border-color: var(--azul);
      background: #fff;
    }

    .compositor-pie .btn-publicar {
      background: var(--azul);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px 20px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .compositor-pie .btn-publicar:hover {
      background: var(--azul-oscuro);
    }

    #aviso {
      color: #e41e3f;
      font-size: 13px;
      font-weight: 600;
      margin: 8px 4px 0;
      min-height: 1.3em;
    }

    #publicaciones {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Publicación estilo Facebook */
    .publicacion {
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 14px 14px 4px;
      position: relative;
    }

    .publicacion .nombre {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      color: var(--texto);
      margin-bottom: 2px;
    }

    .publicacion .nombre::before {
      content: attr(data-inicial);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--azul), #0d65d9);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .publicacion .fecha {
      font-size: 12px;
      color: var(--texto-suave);
      margin: 0 0 8px 50px;
    }

    .publicacion .mensaje {
      margin: 0 0 6px 50px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--texto);
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .acciones-publicacion {
      position: relative;
    }

    .contador-likes {
      position: absolute;
      top: -22px;
      right: 0;
      font-size: 13px;
      color: var(--texto-suave);
      font-weight: 600;
    }

    .botones-publicacion {
      display: flex;
      border-top: 1px solid #e4e6eb;
      margin-top: 6px;
    }

    .botones-publicacion button {
      flex: 1;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--texto-suave);
      padding: 10px 6px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s, color 0.15s;
    }

    .botones-publicacion button:hover {
      background: var(--hover);
      color: var(--texto);
    }

    .btn-like {
      font-size: 17px;
    }

    .btn-like::after {
      content: "Me gusta";
      font-size: 14px;
      font-weight: 600;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
    }

    .btn-eliminar:hover {
      color: #e41e3f;
    }

    .vacio {
      text-align: center;
      color: var(--texto-suave);
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 40px 20px;
      font-size: 15px;
    }

    footer {
      text-align: center;
      color: var(--texto-suave);
      font-size: 13px;
      padding: 24px 0 40px;
    }

    @media (max-width: 520px) {
      .publicacion .mensaje,
      .publicacion .fecha {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="barra">
    <div class="marca">
      <span class="logo-icono">G3</span>
      <span class="marca-texto">Red Social</span>
    </div>
  </div>

  <main class="contenedor">
    <form id="formulario-publicacion" class="compositor">
      <textarea id="mensaje"
        name="mensaje"
        rows="2"
        placeholder="¿Qué estás pensando?"
        maxlength="200"
      ></textarea>

      <div class="compositor-pie">
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" maxlength="50">
        <button type="submit" id="btn-publicar" class="btn-publicar">Publicar</button>
      </div>

      <p id="aviso" aria-live="polite"></p>
    </form>

    <ul id="publicaciones"></ul>

    <footer>Mini red social estudiantil · Grupo 3</footer>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/publicaciones.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
